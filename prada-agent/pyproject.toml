[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prada-agent"
version = "0.1.0"
description = "A self-evolving multi-platform AI agent with closed-loop learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Prada Team", email = "team@prada-agent.dev"}
]
keywords = ["ai", "agent", "llm", "automation", "multi-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core LLM providers
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    
    # HTTP & async
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    
    # Database & storage
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # Terminal & processes
    "paramiko>=3.4.0",
    "docker>=7.0.0",
    
    # Message platforms
    "python-telegram-bot>=21.0",
    "discord.py>=2.3.0",
    "slack-bolt>=1.18.0",
    "twilio>=8.0.0",
    
    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "watchdog>=4.0.0",
    "cryptography>=42.0.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.0",
    
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
all-platforms = [
    "matrix-nio>=0.23.0",
    "homeassistant-api>=0.12.0",
    "bluebubbles-api>=1.0.0",
]
memory-providers = [
    "chromadb>=0.5.0",
    "neo4j>=5.0.0",
    "weaviate-client>=4.0.0",
]

[project.scripts]
prada = "prada_cli.main:cli"
prada-gateway = "gateway.run:main"

[project.entry-points."prada.plugins"]
# Plugin discovery entry point

[tool.setuptools.packages.find]
where = ["."]
include = ["prada_agent*", "prada_cli*", "agent*", "tools*", "gateway*", "plugins*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring live API credentials",
    "slow: marks tests as slow-running",
]
